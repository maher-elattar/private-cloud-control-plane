name: private-cloud-phase4

x-service-build: &service-build
  context: ../..
  dockerfile: tools/docker/service.Dockerfile
  target: runtime

x-runtime-environment: &runtime-environment
  NODE_ENV: production
  DEPLOYMENT_ENVIRONMENT: local
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_METRIC_EXPORT_INTERVAL: '5000'
  OTEL_METRIC_EXPORT_TIMEOUT: '4000'
  OTEL_SDK_DISABLED: 'false'

x-database-environment: &database-environment
  DATABASE_URL: postgresql://private_cloud:private_cloud@postgres:5432/private_cloud

x-worker-environment: &worker-environment
  KAFKA_BROKERS: kafka:29092
  KAFKA_HANDLER_MAX_ATTEMPTS: '3'

x-service-healthcheck: &service-healthcheck
  interval: 3s
  timeout: 3s
  retries: 30
  start_period: 10s

services:
  postgres:
    image: postgres:16.10-alpine
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    environment:
      POSTGRES_DB: private_cloud
      POSTGRES_USER: private_cloud
      POSTGRES_PASSWORD: private_cloud
    ports: ['55432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U private_cloud -d private_cloud']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: ['postgres-data:/var/lib/postgresql/data']

  migrate:
    image: private-cloud/local-runner:phase4
    build:
      <<: *service-build
      args: { APP: control-api }
      target: local-runtime
    command: ['node', 'tools/db/migrate.mjs']
    environment: *database-environment
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  seed:
    image: private-cloud/local-runner:phase4
    command: ['node', 'tools/db/seed.mjs']
    environment: *database-environment
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: 'no'

  local-oidc:
    image: private-cloud/local-runner:phase4
    command: ['node', 'local-oidc.mjs']
    environment:
      LOCAL_OIDC_HOST: 0.0.0.0
      LOCAL_OIDC_PORT: '18080'
      LOCAL_OIDC_ISSUER: http://local-oidc:18080
      LOCAL_OIDC_AUDIENCE: private-cloud-control-plane
    ports: ['18080:18080']
    healthcheck:
      <<: *service-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:18080/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
    restart: unless-stopped

  local-proxmox-tls:
    image: private-cloud/local-runner:phase4
    user: root
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        if [ ! -s /tls/local-proxmox.crt ] || [ ! -s /tls/local-proxmox.key ]; then
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 2 \
            -subj '/CN=local-proxmox' \
            -addext 'subjectAltName=DNS:local-proxmox,IP:127.0.0.1' \
            -keyout /tls/local-proxmox.key \
            -out /tls/local-proxmox.crt
        fi
        chown 1000:1000 /tls/local-proxmox.crt /tls/local-proxmox.key
        chmod 0444 /tls/local-proxmox.crt
        chmod 0400 /tls/local-proxmox.key
    volumes: ['proxmox-tls:/tls']
    restart: 'no'

  local-proxmox:
    image: private-cloud/local-runner:phase4
    command: ['node', 'local-proxmox.mjs']
    environment:
      LOCAL_PROXMOX_HOST: 0.0.0.0
      LOCAL_PROXMOX_PORT: '8443'
      LOCAL_PROXMOX_CERTIFICATE: /tls/local-proxmox.crt
      LOCAL_PROXMOX_PRIVATE_KEY: /tls/local-proxmox.key
      NODE_EXTRA_CA_CERTS: /tls/local-proxmox.crt
    ports: ['18443:8443']
    depends_on:
      local-proxmox-tls: { condition: service_completed_successfully }
    volumes: ['proxmox-tls:/tls:ro']
    healthcheck:
      <<: *service-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('https://127.0.0.1:8443/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.7
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports: ['3200:3200']
    restart: unless-stopped

  otel-collector:
    build:
      context: ../..
      dockerfile: tools/docker/otel-collector.Dockerfile
    command: ['--config=/etc/otelcol/config.yaml']
    environment:
      POSTGRES_PASSWORD: private_cloud
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports: ['4317:4317', '4318:4318', '8889:8889', '13133:13133']
    depends_on:
      postgres: { condition: service_healthy }
      tempo: { condition: service_started }
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:13133/']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  kafka:
    build:
      context: ../..
      dockerfile: tools/docker/kafka.Dockerfile
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports: ['9092:9092']
    depends_on:
      otel-collector: { condition: service_healthy }
    healthcheck:
      # Avoid launching a competing JVM for every liveness probe. The dependent topic job
      # performs the protocol-level readiness check before Connect or applications can start.
      test: ['CMD', 'nc', '-z', '127.0.0.1', '29092']
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 10s
    volumes: ['kafka-data:/var/lib/kafka/data']
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.1.2
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ['/bin/bash', '/config/create-topics.sh']
    volumes:
      - ./kafka/create-topics.sh:/config/create-topics.sh:ro
    restart: 'no'

  debezium-connect:
    build:
      context: ../..
      dockerfile: tools/docker/debezium-connect.Dockerfile
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
      otel-collector: { condition: service_healthy }
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: private-cloud-connect
      CONFIG_STORAGE_TOPIC: connect.configs
      OFFSET_STORAGE_TOPIC: connect.offsets
      STATUS_STORAGE_TOPIC: connect.status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_PLUGIN_DISCOVERY: service_load
      CONNECT_SCHEDULED_REBALANCE_MAX_DELAY_MS: '5000'
      ENABLE_OTEL: 'true'
      OTEL_SDK_DISABLED: 'false'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: debezium-connect
      OTEL_PROPAGATORS: tracecontext
      OTEL_INSTRUMENTATION_KAFKA_ENABLED: 'false'
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
    ports: ['8083:8083']
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail --silent http://127.0.0.1:8083/connectors >/dev/null']
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 120s
    restart: unless-stopped

  debezium-init:
    image: curlimages/curl:8.16.0
    depends_on:
      debezium-connect: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    entrypoint: ['/bin/sh', '/config/register-connector.sh']
    volumes:
      - ./debezium/register-connector.sh:/config/register-connector.sh:ro
      - ./debezium/outbox-connector.json:/config/outbox-connector.json:ro
    restart: 'no'

  proxmox-provider:
    image: private-cloud/proxmox-provider:phase4
    build:
      <<: *service-build
      args: { APP: proxmox-provider }
    environment:
      <<: *runtime-environment
      PORT: '3002'
      GRPC_LISTEN_URL: 0.0.0.0:50052
      PROVIDER_ADAPTER: ${PHASE4_PROVIDER_ADAPTER:-fake}
      FAKE_PROVIDER_SCENARIO: ${PHASE4_FAKE_PROVIDER_SCENARIO:-success}
      FAKE_PROVIDER_LATENCY_MS: ${PHASE4_FAKE_PROVIDER_LATENCY_MS:-20}
      FAKE_PROVIDER_TASK_POLLS: ${PHASE4_FAKE_PROVIDER_TASK_POLLS:-1}
      NODE_EXTRA_CA_CERTS: /etc/private-cloud/tls/local-proxmox.crt
      PROXMOX_ENDPOINT: https://local-proxmox:8443
      PROXMOX_API_TOKEN_ID: local@pve!phase4
      PROXMOX_API_TOKEN_SECRET: local-secret
      PROXMOX_PROVIDER_PROFILE_ID: fake-lab
      PROXMOX_CLUSTER_ALIAS: local-proxmox
      PROXMOX_NODE: pve-lab-1
      PROXMOX_TEMPLATE_VMID: '9000'
      PROXMOX_IMAGE_ID: ubuntu-24-04-cloud
      PROXMOX_STORAGE: lab-storage
      PROXMOX_BRIDGE: vmbr1
      PROXMOX_NETWORK_ID: lab-primary
      PROXMOX_IPV4_CIDR: 192.0.2.0/27
      PROXMOX_IPV4_GATEWAY: 192.0.2.1
      PROXMOX_VMID_MINIMUM: '910000'
      PROXMOX_VMID_MAXIMUM: '910099'
      PROXMOX_PROJECT_ID: 00000000-0000-4000-8000-000000000001
    ports: ['50052:50052']
    depends_on:
      otel-collector: { condition: service_healthy }
      local-proxmox: { condition: service_healthy }
    volumes: ['proxmox-tls:/etc/private-cloud/tls:ro']
    healthcheck:
      <<: *service-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
    restart: unless-stopped

  provisioning-orchestrator:
    image: private-cloud/provisioning-orchestrator:phase4
    build:
      <<: *service-build
      args: { APP: provisioning-orchestrator }
    environment:
      <<: [*runtime-environment, *database-environment, *worker-environment]
      PORT: '3001'
      PROVIDER_GRPC_URL: proxmox-provider:50052
      PROVIDER_GRPC_DEADLINE_MS: '10000'
      WORKER_ID: phase4-orchestrator-1
    depends_on:
      seed: { condition: service_completed_successfully }
      debezium-init: { condition: service_completed_successfully }
      proxmox-provider: { condition: service_healthy }
    healthcheck:
      <<: *service-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
    restart: unless-stopped

  control-api:
    image: private-cloud/control-api:phase4
    build:
      <<: *service-build
      args: { APP: control-api }
    environment:
      <<: [*runtime-environment, *database-environment, *worker-environment]
      PORT: '3000'
      GRPC_LISTEN_URL: 0.0.0.0:50051
      OIDC_ISSUER: http://local-oidc:18080
      OIDC_AUDIENCE: private-cloud-control-plane
      OIDC_JWKS_URI: http://local-oidc:18080/.well-known/jwks.json
    ports: ['3100:3000', '50051:50051']
    depends_on:
      seed: { condition: service_completed_successfully }
      debezium-init: { condition: service_completed_successfully }
      local-oidc: { condition: service_healthy }
    healthcheck:
      <<: *service-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
    restart: unless-stopped

  reconciler:
    image: private-cloud/reconciler:phase4
    build:
      <<: *service-build
      args: { APP: reconciler }
    environment:
      <<: *runtime-environment
      PORT: '3003'
    depends_on:
      otel-collector: { condition: service_healthy }
    healthcheck:
      <<: *service-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3003/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.12.0
    command: ['--config.file=/etc/prometheus/prometheus.yaml', '--storage.tsdb.path=/prometheus']
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports: ['9090:9090']
    depends_on:
      otel-collector: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:9090/-/ready']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_USERS_VIEWERS_CAN_EDIT: 'true'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ['3101:3000']
    depends_on:
      prometheus: { condition: service_healthy }
      tempo: { condition: service_started }
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --spider http://127.0.0.1:3000/api/health']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
  proxmox-tls:
  tempo-data:
  prometheus-data:
  grafana-data:
