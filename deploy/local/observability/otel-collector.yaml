extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  postgresql:
    endpoint: postgres:5432
    transport: tcp
    username: private_cloud
    password: ${env:POSTGRES_PASSWORD}
    databases: [private_cloud]
    collection_interval: 5s
    initial_delay: 1s
    tls:
      insecure: true
    metrics:
      postgresql.database.locks:
        enabled: true

  sqlquery/replication-slots:
    driver: postgres
    datasource: host=postgres port=5432 user=private_cloud password=${env:POSTGRES_PASSWORD} dbname=private_cloud sslmode=disable
    collection_interval: 5s
    queries:
      - sql: >-
          SELECT slot_name,
                 CASE WHEN active THEN 1 ELSE 0 END AS active,
                 COALESCE(pg_wal_lsn_diff(pg_current_wal_lsn(), restart_lsn), 0)::double precision AS retained_bytes
          FROM pg_replication_slots
          WHERE slot_type = 'logical'
        metrics:
          - metric_name: postgresql.replication_slot.active
            value_column: active
            value_type: int
            attribute_columns: [slot_name]
          - metric_name: postgresql.replication_slot.retained
            value_column: retained_bytes
            value_type: double
            unit: By
            attribute_columns: [slot_name]

  prometheus/collector-self:
    config:
      scrape_configs:
        - job_name: otel-collector-self
          scrape_interval: 5s
          static_configs:
            - targets: ['127.0.0.1:8888']

processors:
  filter/drop-java-runtime:
    error_mode: ignore
    metrics:
      metric:
        - 'IsMatch(name, "^jvm\\.")'
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  resource/sanitize:
    attributes:
      - { key: host.name, action: delete }
      - { key: container.id, action: delete }
      - { key: process.command_line, action: delete }
      - { key: process.command_args, action: delete }
      - { key: process.executable.path, action: delete }
      - { key: process.owner, action: delete }
      - { key: process.pid, action: delete }
      - { key: service.instance.id, action: delete }
  batch:
    timeout: 1s

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true
    resource_to_telemetry_conversion:
      enabled: true

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/sanitize, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp, postgresql, sqlquery/replication-slots, prometheus/collector-self]
      processors: [memory_limiter, filter/drop-java-runtime, resource/sanitize, batch]
      exporters: [prometheus]
