global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Applications, Java agents, PostgreSQL, and Collector self-telemetry converge at this endpoint.
# The Prometheus server never reaches into a workload or infrastructure process directly.
scrape_configs:
  - job_name: otel-collector-consolidated
    static_configs:
      - targets: ['otel-collector:8889']
