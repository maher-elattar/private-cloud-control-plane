---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-fixtures
  namespace: private-cloud
  labels:
    app.kubernetes.io/name: local-fixtures
    app.kubernetes.io/part-of: private-cloud-control-plane
  annotations: { argocd.argoproj.io/sync-wave: '0' }
automountServiceAccountToken: false
---
# The console's identity.
#
# One per workload, and this one needs nothing from the API server: the console talks to
# control-api over HTTP with a tenant's token, never to Kubernetes. The token is therefore not
# mounted, which is the default here for exactly that reason.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: console
  namespace: private-cloud
  labels:
    app.kubernetes.io/name: console
    app.kubernetes.io/part-of: private-cloud-control-plane
  annotations: { argocd.argoproj.io/sync-wave: '0' }
automountServiceAccountToken: false
