# One identity per service. WHY not the namespace `default` service account: an identity shared
# by four workloads cannot be revoked for one of them, and a NetworkPolicy or RoleBinding written
# against it necessarily grants more than the workload it was written for.
#
# None of these mounts an API token. The control plane never calls the Kubernetes API; it talks to
# PostgreSQL, Kafka, and the provider. A token that is never read is only an exposure.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-api
  namespace: private-cloud
  labels:
    { app.kubernetes.io/name: control-api, app.kubernetes.io/part-of: private-cloud-control-plane }
  annotations: { argocd.argoproj.io/sync-wave: '0' }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provisioning-orchestrator
  namespace: private-cloud
  labels:
    app.kubernetes.io/name: provisioning-orchestrator
    app.kubernetes.io/part-of: private-cloud-control-plane
  annotations: { argocd.argoproj.io/sync-wave: '0' }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: proxmox-provider
  namespace: private-cloud
  labels:
    app.kubernetes.io/name: proxmox-provider
    app.kubernetes.io/part-of: private-cloud-control-plane
  annotations: { argocd.argoproj.io/sync-wave: '0' }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reconciler
  namespace: private-cloud
  labels:
    { app.kubernetes.io/name: reconciler, app.kubernetes.io/part-of: private-cloud-control-plane }
  annotations: { argocd.argoproj.io/sync-wave: '0' }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane-jobs
  namespace: private-cloud
  labels:
    app.kubernetes.io/name: control-plane-jobs
    app.kubernetes.io/part-of: private-cloud-control-plane
  annotations: { argocd.argoproj.io/sync-wave: '0' }
