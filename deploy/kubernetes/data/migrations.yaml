# Sync wave 3 — schema migrations and the local seed, as an Argo CD sync hook.
#
# WHY a hook rather than a plain Job: a Job's pod template is immutable, so a plain Job re-applied
# with unchanged content never runs again, and a migration that must run on every release would
# silently run only once. `hook: Sync` with `hook-delete-policy: BeforeHookCreation` deletes the
# previous run and creates a new one on each sync, which is the behaviour a migration step needs.
#
# WHY wave 3 rather than beside the database in wave 2: Argo CD does not start a wave until the
# previous one is healthy, so a wave-3 hook is guaranteed a primary that is accepting connections.
# It still lands before the applications in wave 4, which is the ordering that matters — a service
# that starts against an unmigrated schema fails in a way that looks like an application bug.
#
# The migration tool is idempotent and checksummed: it takes an advisory lock, records each file's
# SHA-256, and refuses to proceed if an applied migration's content has changed. Running it on
# every sync is therefore safe, and a corrupted history is a loud failure rather than a quiet one.
apiVersion: batch/v1
kind: Job
metadata:
  name: schema-migrations
  namespace: private-cloud
  labels:
    {
      app.kubernetes.io/name: schema-migrations,
      app.kubernetes.io/part-of: private-cloud-control-plane,
    }
  annotations:
    argocd.argoproj.io/hook: Sync
    # `HookSucceeded` so a completed migration is cleaned up by Argo CD itself rather than left
    # behind as a tracked object that is in the cluster but not in the manifests — which Argo CD
    # reports as a degraded application even though the migration succeeded. `BeforeHookCreation`
    # keeps a *failed* run around for inspection until the next sync replaces it.
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
    argocd.argoproj.io/sync-wave: '3'
spec:
  backoffLimit: 6
  # No `ttlSecondsAfterFinished`. The Job's lifetime is owned by `BeforeHookCreation`, which
  # deletes the previous run when the next sync starts one. A TTL on top of that would have
  # Kubernetes delete a Job that Argo CD is still tracking, and a tracked resource that vanishes
  # is reported as a degraded application — an alert about a migration that in fact succeeded.
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schema-migrations
        app.kubernetes.io/part-of: private-cloud-control-plane
    spec:
      restartPolicy: Never
      serviceAccountName: control-plane-jobs
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Numeric, because the kubelet cannot verify that a symbolic `USER node` is non-root and
        # refuses to start the container at all. 1000 is what `node` resolves to in the official
        # Node.js images this service is built from.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: private-cloud/local-runner:phase6
          imagePullPolicy: IfNotPresent
          command: ['/bin/sh', '-ec']
          args:
            - |
              node tools/db/migrate.mjs
              node tools/db/seed.mjs
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  # Generated by CloudNativePG when it bootstrapped the cluster.
                  name: control-plane-postgres-app
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 1000m, memory: 512Mi }
---
# The migration job is inside the default-deny boundary and needs the database plus DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-migrations-egress
  namespace: private-cloud
  labels: { app.kubernetes.io/part-of: private-cloud-control-plane }
  annotations: { argocd.argoproj.io/sync-wave: '0' }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: schema-migrations }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels: { cnpg.io/cluster: control-plane-postgres }
      ports:
        - { protocol: TCP, port: 5432 }
