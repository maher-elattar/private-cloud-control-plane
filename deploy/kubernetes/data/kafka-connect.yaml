# Sync wave 2 — change data capture.
#
# This is the piece that turns a committed database row into a published Kafka record. The
# services never produce to Kafka themselves; they write a row to `control.outbox` or
# `workflow.outbox` inside the same transaction as the state change, and this connector reads the
# write-ahead log and republishes it. That is what makes "the event happened" and "the state
# changed" the same fact rather than two facts that can disagree.
#
# The Event Router settings below mirror `deploy/local/debezium/outbox-connector.json` exactly.
# They are the contract between the outbox table's columns and the Kafka record's topic, key, and
# headers, and a difference between the two environments would be a difference in what the
# consumer receives.
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: control-plane-connect
  namespace: private-cloud
  labels: { app.kubernetes.io/part-of: private-cloud-control-plane }
  annotations:
    argocd.argoproj.io/sync-wave: '2'
    # Without this the operator ignores `KafkaConnector` objects and connectors have to be
    # registered over the REST API, which is exactly the hand-made step this deployment removes.
    strimzi.io/use-connector-resources: 'true'
spec:
  version: 4.3.1
  replicas: 1
  # Built by `tools/docker/kafka-connect.Dockerfile` and loaded into the node's image store.
  image: private-cloud/kafka-connect:phase6
  bootstrapServers: control-plane-kafka-kafka-bootstrap:9093
  # Promoted to first-class fields in the v1 API. They used to live in `config`, where a typo was
  # accepted silently and produced a Connect cluster that shared another one's internal topics.
  groupId: private-cloud-connect
  configStorageTopic: connect.configs
  offsetStorageTopic: connect.offsets
  statusStorageTopic: connect.status
  tls:
    trustedCertificates:
      - secretName: control-plane-kafka-cluster-ca-cert
        pattern: '*.crt'
  authentication:
    type: scram-sha-512
    username: kafka-connect
    passwordSecret:
      # Generated by the User Operator from the `kafka-connect` KafkaUser. Named here, never valued.
      secretName: kafka-connect
      password: password
  config:
    config.storage.replication.factor: 1
    offset.storage.replication.factor: 1
    status.storage.replication.factor: 1
    key.converter: org.apache.kafka.connect.storage.StringConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable: false
    # Database credentials are read from a mounted Secret at connector-configuration time, so no
    # password is ever written into a `KafkaConnector` object or into this repository.
    config.providers: directory
    config.providers.directory.class: org.apache.kafka.common.config.provider.DirectoryConfigProvider
    config.providers.directory.param.allowed.paths: /mnt
  # Strimzi owns the producer interceptor list and refuses a hand-set
  # `producer.interceptor.classes`, which is the right call: the interceptor has to be installed
  # alongside a tracing agent that is also Strimzi's to configure. Declaring the tracing type gets
  # both, and is what restores the Debezium Event Router's trace context across the broker.
  tracing:
    type: opentelemetry
  template:
    pod:
      volumes:
        - name: postgres-app
          secret:
            secretName: control-plane-postgres-app
    connectContainer:
      volumeMounts:
        - name: postgres-app
          # Strimzi refuses any additional volume mounted outside `/mnt`, so that an operator
          # cannot accidentally shadow a path the Connect distribution owns.
          mountPath: /mnt/postgres-app
          readOnly: true
  resources:
    requests: { cpu: 200m, memory: 768Mi }
    limits: { cpu: 2000m, memory: 1536Mi }
  readinessProbe: { initialDelaySeconds: 30, timeoutSeconds: 5 }
  livenessProbe: { initialDelaySeconds: 60, timeoutSeconds: 5 }
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: private-cloud-outbox
  namespace: private-cloud
  labels:
    strimzi.io/cluster: control-plane-connect
    app.kubernetes.io/part-of: private-cloud-control-plane
  annotations:
    # Wave 4, behind the schema migration in wave 3. WHY: the connector's first action is to build
    # a filtered publication from `table.include.list`, and a filter that matches no table is a
    # permanent task failure — `No table filters found for filtered publication` — not a retry. A
    # connector started against an empty schema therefore stays dead until someone restarts the
    # task by hand, long after the tables it was waiting for exist.
    argocd.argoproj.io/sync-wave: '4'
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  # One task. The PostgreSQL connector reads a single replication slot and cannot be parallelised;
  # a second task would contend for the same slot rather than double the throughput.
  tasksMax: 1
  config:
    database.hostname: control-plane-postgres-rw.private-cloud.svc.cluster.local
    database.port: '5432'
    database.user: ${directory:/mnt/postgres-app:username}
    database.password: ${directory:/mnt/postgres-app:password}
    database.dbname: ${directory:/mnt/postgres-app:dbname}
    topic.prefix: private-cloud-cdc
    plugin.name: pgoutput
    slot.name: private_cloud_outbox
    publication.name: private_cloud_outbox
    publication.autocreate.mode: filtered
    snapshot.mode: initial
    custom.metric.tags: pipeline=private-cloud-outbox
    # Only the two outbox tables. Everything else in the database is invisible to change data
    # capture, which is the property that makes the outbox a contract rather than a leak.
    table.include.list: control.outbox,workflow.outbox
    tombstones.on.delete: 'false'
    key.converter: org.apache.kafka.connect.storage.StringConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable: 'false'
    transforms: outbox
    transforms.outbox.type: io.debezium.transforms.outbox.EventRouter
    transforms.outbox.table.field.event.id: event_id
    transforms.outbox.table.field.event.key: partition_key
    transforms.outbox.table.field.event.payload: payload
    transforms.outbox.table.expand.json.payload: 'true'
    transforms.outbox.route.by.field: topic
    transforms.outbox.route.topic.regex: (?<routedByValue>.*)
    transforms.outbox.route.topic.replacement: ${routedByValue}
    transforms.outbox.table.fields.additional.placement: outbox_id:header:outbox-id,event_id:header:event-id,schema_name:header:schema-name,schema_version:header:schema-version,replay_generation:header:replay-generation
    transforms.outbox.tracing.span.context.field: tracingspancontext
    transforms.outbox.tracing.operation.name: debezium-read
    transforms.outbox.tracing.with.context.field.only: 'true'
