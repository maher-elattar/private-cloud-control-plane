# Sync wave 5 — the blue-green delivery dashboard.
#
# Delivered as a ConfigMap with the `grafana_dashboard` label, which is how the cluster's Grafana
# sidecar discovers dashboards. WHY that rather than clicking one together in the UI: a dashboard
# built in a browser is not in the repository, is not reviewed, and does not come back when the
# Grafana pod is replaced. This one is a file, and a change to it is a diff.
#
# The panels read exactly the series the AnalysisTemplates read. That is deliberate — an operator
# looking at why a promotion aborted should be looking at the same numbers the controller used,
# not at a second measurement that might disagree.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-blue-green
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
    app.kubernetes.io/part-of: private-cloud-control-plane
  annotations:
    argocd.argoproj.io/sync-wave: '5'
data:
  private-cloud-blue-green.json: |
    {
      "uid": "private-cloud-bluegreen",
      "title": "Private Cloud \u2014 Blue-Green Delivery",
      "description": "The promotion gate, drawn. Every panel here reads the same series the Argo Rollouts AnalysisTemplates read, so a promotion that failed and a graph that looks wrong are the same fact rather than two things to reconcile.",
      "tags": [
        "private-cloud",
        "argo-rollouts",
        "blue-green"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "label": "Data source"
          },
          {
            "name": "namespace",
            "type": "constant",
            "query": "private-cloud",
            "hide": 2
          },
          {
            "name": "service",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": "label_values(http_server_request_duration_count{namespace=\"$namespace\"}, service)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "label": "Service"
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Promotion gate",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "stat",
          "title": "Green success rate",
          "description": "Share of HTTP 200 responses from the preview (green) environment over the last two minutes. The promotion gate requires this to stay above 0.90; below it, Argo Rollouts aborts and the active Service never moves.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "(\n  sum by (service) (rate(http_server_request_duration_count{namespace=\"$namespace\", service=~\".*-preview\", http_response_status_code=\"200\"}[2m])) or vector(0)\n)\n/\nclamp_min(\n  sum by (service) (rate(http_server_request_duration_count{namespace=\"$namespace\", service=~\".*-preview\"}[2m])) or vector(0),\n  0.001\n)",
              "legendFormat": "{{service}}",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.9
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Success rate by environment",
          "description": "Active and preview side by side. A promotion is the moment the two converge, because the active Service starts selecting the same ReplicaSet the preview one does.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 6,
            "w": 16,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "(\n  sum by (service) (rate(http_server_request_duration_count{namespace=\"$namespace\", service=~\"$service\", http_response_status_code=\"200\"}[2m])) or vector(0)\n)\n/\nclamp_min(\n  sum by (service) (rate(http_server_request_duration_count{namespace=\"$namespace\", service=~\"$service\"}[2m])) or vector(0),\n  0.001\n)",
              "legendFormat": "{{service}}",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "unit": "percentunit",
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.9
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "row",
          "title": "Traffic and health",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 7
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Request rate",
          "description": "Requests per second per environment. The promotion gate's traffic floor lives here: a success rate computed over no requests is an absence of information, not a pass.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (service) (rate(http_server_request_duration_count{namespace=\"$namespace\", service=~\"$service\"}[2m]))",
              "legendFormat": "{{service}}",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Responses by status code",
          "description": "What the green environment is actually returning. A gate failure is usually visible here first, as a class of response that was not there before.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (http_response_status_code) (rate(http_server_request_duration_count{namespace=\"$namespace\", service=~\"$service\"}[2m]))",
              "legendFormat": "{{http_response_status_code}}",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Ready and scraped pods per environment",
          "description": "A pod appears here only after its readiness probe passes and Prometheus scrapes it, which is the same condition the scrape-health metric counts.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 15
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "count by (service) (up{namespace=\"$namespace\", service=~\"$service\"} == 1)",
              "legendFormat": "{{service}}",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Request latency, 95th percentile",
          "description": "Not a gate, deliberately: a green environment can be slower than blue and still be correct. It is here because a success rate that holds while latency climbs is the shape of a dependency failing behind a retry.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 15
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (service, le) (rate(http_server_request_duration_bucket{namespace=\"$namespace\", service=~\"$service\"}[2m])))",
              "legendFormat": "{{service}}",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "row",
          "title": "Delivery pipeline",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Rollout phase",
          "description": "One series per rollout phase. Healthy is the steady state; Progressing and Paused are a release in flight; Degraded means an abort happened and the previous version is still serving.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 23
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (name, phase) (rollout_info{namespace=\"$namespace\"})",
              "legendFormat": "{{name}} \u2014 {{phase}}",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Outbox backlog",
          "description": "Rows committed to the outbox and not yet published by change data capture. A backlog that never returns to zero means the events and the state have diverged, which is the one failure this architecture exists to prevent.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 23
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (outbox_owner) (controlplane_outbox_pending)",
              "legendFormat": "{{outbox_owner}}",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ]
    }
