# Sync wave 3 — what the cluster Prometheus scrapes.
#
# Every object here carries `release: my-kube-prometheus-stack`, because the Prometheus custom
# resource on this cluster selects monitoring objects by that label in any namespace. Without it
# the object is valid, is accepted by the API server, and is collected by nothing — a failure mode
# that looks exactly like a working configuration until an analysis run returns no data.
#
# The interval is 10s rather than the cluster default of 30s. A blue-green promotion gate that
# samples three times needs those samples inside the promotion window, not spread across a minute
# and a half.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: control-plane-preview
  namespace: private-cloud
  labels:
    release: my-kube-prometheus-stack
    app.kubernetes.io/part-of: private-cloud-control-plane
  annotations: { argocd.argoproj.io/sync-wave: '3' }
spec:
  # **This is the object the promotion gate depends on.** Argo Rollouts keeps each preview Service
  # selecting the green ReplicaSet by pod-template-hash, so scraping through the preview Services
  # yields the green pods and only the green pods. The `service` label Prometheus attaches is what
  # the analysis query filters on.
  selector:
    matchLabels:
      app.kubernetes.io/part-of: private-cloud-control-plane
      private-cloud.io/rollout-role: preview
  namespaceSelector:
    matchNames: [private-cloud]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 10s
      scrapeTimeout: 5s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: control-plane-active
  namespace: private-cloud
  labels:
    release: my-kube-prometheus-stack
    app.kubernetes.io/part-of: private-cloud-control-plane
  annotations: { argocd.argoproj.io/sync-wave: '3' }
spec:
  # The blue side, for comparison. A green success rate is only meaningful next to the rate the
  # environment it is replacing was achieving.
  selector:
    matchLabels:
      app.kubernetes.io/part-of: private-cloud-control-plane
      private-cloud.io/rollout-role: active
  namespaceSelector:
    matchNames: [private-cloud]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 10s
      scrapeTimeout: 5s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector
  namespace: private-cloud
  labels:
    release: my-kube-prometheus-stack
    app.kubernetes.io/part-of: private-cloud-control-plane
  annotations: { argocd.argoproj.io/sync-wave: '3' }
spec:
  # The aggregate pipeline: control-plane counters, workflow gauges, and the span-derived latency
  # histograms with exemplars.
  selector:
    matchLabels: { app.kubernetes.io/name: otel-collector }
  namespaceSelector:
    matchNames: [private-cloud]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
    - port: self-metrics
      path: /metrics
      interval: 30s
