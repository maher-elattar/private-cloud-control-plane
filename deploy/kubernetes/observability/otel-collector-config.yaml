extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

connectors:
  span_metrics:
    namespace: controlplane.trace
    histogram:
      unit: s
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s, 30s, 60s]
    exemplars:
      enabled: true
      max_per_data_point: 5
    exclude_dimensions: [collector.instance.id]
    resource_metrics_key_attributes:
      - service.name
      - service.namespace
      - service.version
      - deployment.environment.name

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  resource/sanitize:
    attributes:
      - { key: host.name, action: delete }
      - { key: container.id, action: delete }
      - { key: process.command, action: delete }
      - { key: process.command_line, action: delete }
      - { key: process.command_args, action: delete }
      - { key: process.executable.path, action: delete }
      - { key: process.owner, action: delete }
      - { key: process.pid, action: delete }
      - { key: service.instance.id, action: delete }
  attributes/sanitize-metrics:
    actions:
      # Endpoint identity is useful in traces but violates the metric-label contract.
      - { key: server.address, action: delete }
      - { key: client.address, action: delete }
      - { key: network.local.address, action: delete }
      - { key: network.peer.address, action: delete }
      - { key: net.host.name, action: delete }
      - { key: net.host.ip, action: delete }
      - { key: net.peer.name, action: delete }
      - { key: net.peer.ip, action: delete }
      - { key: http.host, action: delete }
  batch:
    timeout: 1s

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true
    resource_to_telemetry_conversion:
      enabled: true
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/sanitize, batch]
      exporters: [span_metrics, debug]
    metrics:
      receivers: [otlp, span_metrics]
      processors: [memory_limiter, resource/sanitize, attributes/sanitize-metrics, batch]
      exporters: [prometheus]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
