apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: control-plane-applications
  namespace: argocd
  labels: { app.kubernetes.io/part-of: private-cloud-control-plane }
  annotations:
    argocd.argoproj.io/sync-wave: '4'
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # The four services as blue-green Rollouts, their active and preview Services, the header-matched HTTPRoute, the analysis templates that gate promotion, and the synthetic load that makes the gate measurable.
  project: private-cloud
  destination:
    server: https://kubernetes.default.svc
    namespace: private-cloud
  # Two fields in this application are written by a controller, not by the repository. Argo CD has
  # to be told, or it reports them as drift forever — and a permanently OutOfSync application is
  # worse than a noisy one: the controller stops treating a *new* revision as a new sync and starts
  # treating it as another self-heal attempt, behind a backoff that reaches five minutes, so real
  # changes stop arriving.
  ignoreDifferences:
    # KEDA writes the orchestrator's replica count through the scale subresource in response to
    # Kafka consumer lag. Without this, self-healing would revert every scaling decision within
    # seconds and the two controllers would fight indefinitely — the autoscaler scaling up, Argo CD
    # scaling back to the manifest's number, forever.
    - group: argoproj.io
      kind: Rollout
      name: provisioning-orchestrator
      jsonPointers:
        - /spec/replicas
    # Argo Rollouts owns the pod-template hash in every active and preview Service selector: it is
    # the field that decides which environment serves, and moving it *is* the promotion. The
    # repository deliberately declares the selector without it. Stripping it — which is what Argo
    # CD would otherwise do on every sync — would point the Service at both environments at once,
    # or at neither, in the middle of a promotion. `RespectIgnoreDifferences` in the sync options
    # is what makes this an exclusion from the apply rather than only from the diff.
    - group: ''
      kind: Service
      jsonPointers:
        - /spec/selector/rollouts-pod-template-hash
  source:
    repoURL: git://gitops-repo.private-cloud-gitops.svc.cluster.local/control-plane.git
    targetRevision: main
    path: applications
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Diff with a server-side apply dry-run instead of comparing rendered YAML to the live
      # object. Without it every custom resource whose CRD sets defaults — an HTTPRoute's
      # `weight: 1`, a Rollout's history limits — is reported permanently OutOfSync for fields no
      # manifest ever set, and real drift becomes impossible to see in the noise.
      - ServerSideDiff=true
      - RespectIgnoreDifferences=true
      - PruneLast=true
    retry:
      limit: 8
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
---
