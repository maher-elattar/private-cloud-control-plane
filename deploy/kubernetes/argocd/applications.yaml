# The applications, one per sync wave.
#
# Argo CD does not start a wave until every resource in the previous one reports Healthy, which is
# what turns this list into an ordering guarantee rather than a hint. The waves follow the order
# the project roadmap specifies: operators and custom resource definitions, then the database and
# Kafka, then observability, then the applications, then dashboards and alerts — with a wave 0
# ahead of all of them for the namespace and its boundaries.
#
# Every application below shares the same sync policy, and each clause is load-bearing:
#
# - `automated.prune` deletes what the repository stopped describing. Without it, removing a
#   manifest leaves the object running forever and the repository stops being the description of
#   the cluster.
# - `automated.selfHeal` reverts changes made to the live cluster by hand. **This is the outer
#   loop of the self-healing the operator asked for**: Argo Rollouts heals a bad *release* by
#   aborting it, and this heals a bad *edit* by undoing it.
# - `ServerSideApply` because several of these objects — the operator CRDs especially — are larger
#   than the annotation a client-side apply writes to record the last applied configuration.
# - `retry` with exponential backoff, because a wave that fails on a transient condition (a
#   webhook that is not serving yet, an admission controller mid-restart) should be tried again
#   rather than left for a human.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: control-plane-foundation
  namespace: argocd
  labels: { app.kubernetes.io/part-of: private-cloud-control-plane }
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Namespace, service accounts, RBAC, network policies, configuration, and disruption budgets. Wave 0 because an operator cannot place a custom resource in a namespace that does not exist yet, and a workload cannot be admitted by a Pod Security profile the namespace has not declared.
  project: private-cloud
  destination:
    server: https://kubernetes.default.svc
    namespace: private-cloud
  source:
    repoURL: git://gitops-repo.private-cloud-gitops.svc.cluster.local/control-plane.git
    targetRevision: main
    path: namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Diff with a server-side apply dry-run instead of comparing rendered YAML to the live
      # object. Without it every custom resource whose CRD sets defaults — an HTTPRoute's
      # `weight: 1`, a Rollout's history limits — is reported permanently OutOfSync for fields no
      # manifest ever set, and real drift becomes impossible to see in the noise.
      - ServerSideDiff=true
      - RespectIgnoreDifferences=true
      - PruneLast=true
    retry:
      limit: 8
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
---
