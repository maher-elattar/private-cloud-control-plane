# The local identity provider. A fixture, not a component: it exists so the API can validate a
# bearer token without reaching an external issuer, and its signing key never leaves this cluster.
apiVersion: v1
kind: Service
metadata:
  name: local-oidc
  namespace: private-cloud
  labels:
    { app.kubernetes.io/name: local-oidc, app.kubernetes.io/part-of: private-cloud-control-plane }
  annotations: { argocd.argoproj.io/sync-wave: '4' }
spec:
  selector: { app.kubernetes.io/name: local-oidc }
  ports:
    - { name: http, port: 18080, targetPort: http }
