# Sync wave 4 — north-south routing, including the header that reaches the green environment.
#
# **This is the header-based routing.** One `HTTPRoute` carries both rules:
#
# - A request with `X-Canary: green` goes to `control-api-preview`, which Argo Rollouts keeps
#   pointed at the green ReplicaSet.
# - Everything else goes to `control-api`, the active Service, which is blue until a promotion
#   moves it.
#
# The ordering is not written anywhere because it does not need to be. Gateway API resolves ties
# by path specificity first and then by the number of header matches, so a rule with one header
# match beats a rule with none on the same path. Both rules therefore match `/`, and the header
# decides — which is exactly the intent, and is stable across implementations rather than
# depending on the order rules happen to appear in this file.
#
# WHY a header rather than a weight: a weighted split decides *for* the caller, at random, which
# version answered them. A header lets an operator, a smoke test, or a synthetic load generator
# choose the green environment deliberately and reproducibly, and lets everyone who did not ask
# stay on the version that is already proven.
#
# The Gateway is the cluster's existing one, attached across namespaces because its `web` listener
# accepts routes `from: All`. Nothing about the Gateway is modified here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: control-api
  namespace: private-cloud
  labels:
    app.kubernetes.io/name: control-api
    app.kubernetes.io/part-of: private-cloud-control-plane
  annotations:
    argocd.argoproj.io/sync-wave: '4'
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - control-plane.test
  rules:
    # Green. Deliberate, opt-in, and reproducible.
    - matches:
        - headers:
            - { type: Exact, name: X-Canary, value: green }
          # The API server defaults an absent path match to exactly this. Writing it out keeps the
          # rendered manifest identical to the stored object, so the route does not read as
          # permanently drifted, and it makes the tie-break visible: both rules match the same
          # path, and the header match is what decides between them.
          path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ''
          kind: Service
          name: control-api-preview
          port: 3000
          # Also a written-out default. There is one backend per rule, so the weight cannot change
          # any routing decision; it is here so the manifest and the stored object agree.
          weight: 1
    # Blue. Everything that did not ask for green.
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ''
          kind: Service
          name: control-api
          port: 3000
          weight: 1
