# Customer console — sync wave 4, alongside the applications it fronts.
#
# A Deployment rather than a Rollout. The blue-green machinery exists for services whose bad
# version corrupts state; this one serves a bundle and proxies requests, so a rolling update is
# both sufficient and simpler to reason about. `render-check.mjs` enforces ROLLOUT_REQUIRED only
# for the workloads that mutate provider state.
#
# @see docs/architecture/phase-6-gitops-deployment.md
# @see deploy/local/compose.console.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: private-cloud
  labels:
    app.kubernetes.io/name: console
    app.kubernetes.io/part-of: private-cloud-control-plane
  annotations:
    argocd.argoproj.io/sync-wave: '4'
spec:
  # One replica, and the reason is the session store. Sessions are held in process, so a second
  # replica would sign a user out on roughly half their requests. Scaling this out means moving
  # them to a shared store, which is the work to do when there is a reason to scale it.
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: console }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: console
        app.kubernetes.io/part-of: private-cloud-control-plane
    spec:
      serviceAccountName: console
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: console
          image: private-cloud/console:phase6
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: PORT, value: '3000' }
            - name: CONTROL_API_URL
              value: http://control-api.private-cloud.svc.cluster.local:3000
            - name: OIDC_ISSUER
              value: http://local-oidc.private-cloud.svc.cluster.local:18080
            # Behind a TLS-terminating gateway, so the session cookie must be Secure. The Compose
            # stack sets this false because a browser silently drops a Secure cookie on an
            # insecure origin, which presents as a login that never sticks.
            - { name: CONSOLE_SECURE_COOKIES, value: 'true' }
            # The demo user's hashed credential. Absent here on purpose: a real deployment points
            # OIDC_ISSUER at a real provider and the local stub is deleted, so there is no user
            # table to seed. SAFE-036 keeps secret values out of GitOps history regardless.
          envFrom:
            - configMapRef: { name: control-plane-config }
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
          readinessProbe:
            # Readiness depends on control-api being reachable, because a console that cannot
            # reach it can render nothing but an error. It deliberately does not depend on the
            # issuer: an issuer outage stops new sign-ins and leaves existing sessions working,
            # and failing readiness for that would turn a partial outage into a total one.
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 25m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: private-cloud
  labels:
    app.kubernetes.io/name: console
    app.kubernetes.io/part-of: private-cloud-control-plane
  annotations:
    argocd.argoproj.io/sync-wave: '4'
spec:
  selector: { app.kubernetes.io/name: console }
  ports:
    - { name: http, port: 3000, targetPort: http }
  # No `private-cloud.io/rollout-role` label and no `metrics` port. The ServiceMonitors select on
  # that label, and pointing one at a Service with no metrics port produces a permanently-down
  # scrape target — a failure mode that looks exactly like a working configuration.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-console-ingress
  namespace: private-cloud
  labels: { app.kubernetes.io/part-of: private-cloud-control-plane }
  annotations: { argocd.argoproj.io/sync-wave: '4' }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: console }
  policyTypes: [Ingress]
  ingress:
    # From the gateway, which is what makes this the one externally reachable workload besides the
    # API, and from inside the namespace for probes and debugging.
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: traefik }
        - podSelector:
            matchLabels: { app.kubernetes.io/part-of: private-cloud-control-plane }
      ports:
        - { protocol: TCP, port: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: console
  namespace: private-cloud
  labels:
    app.kubernetes.io/name: console
    app.kubernetes.io/part-of: private-cloud-control-plane
  annotations:
    argocd.argoproj.io/sync-wave: '4'
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: web
  # Its own hostname rather than a path under the API's. `control-api` owns
  # `control-plane.test` at `/`, and the console serves `/` too — a path-based split would put the
  # console's own `/v1` proxy in permanent conflict with the API's.
  hostnames:
    - console.control-plane.test
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ''
          kind: Service
          name: console
          port: 3000
          weight: 1
